 <div class="container">
    <div class="main-card">
      <div class="inner-navbar d-flex justify-content-between align-items-center">
        <h5>Vendor Master</h5>
      </div>

      <div class="form-section">
        <!-- Vendor Creation Form -->
        <form (ngSubmit)="onSubmit()" #vendorForm="ngForm" class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Vendor Code</label>
            <input type="text" class="form-control" name="vendor" [(ngModel)]="vendor.vendor" placeholder="Enter vendor code" required />
          </div>

          <div class="col-md-4">
            <label class="form-label">Vendor Name</label>
            <input type="text" class="form-control" name="name" [(ngModel)]="vendor.name" placeholder="Enter vendor name" required />
          </div>

          <div class="col-md-4">
            <label class="form-label">Arabic Name</label>
            <input type="text" class="form-control" name="namear" [(ngModel)]="vendor.namear" placeholder="Enter Arabic name" />
          </div>

          <div class="col-md-4">
            <label class="form-label">Phone</label>
            <input type="text" class="form-control" name="phone" [(ngModel)]="vendor.phone" placeholder="Enter phone number" />
          </div>

          <div class="col-md-4">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" name="email" [(ngModel)]="vendor.email" placeholder="vendor@example.com" />
          </div>

          <div class="col-md-4">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" [(ngModel)]="vendor.address" placeholder="Enter address" />
          </div>

          <div class="col-md-4">
            <label class="form-label">VAT No</label>
            <input type="text" class="form-control" name="vatno" [(ngModel)]="vendor.vatno" placeholder="Enter VAT number" />
          </div>

          <div class="col-12 text-end mt-3">
            <button type="submit" class="btn btn-primary">
              {{ isEditing ? 'Update Vendor' : 'Add Vendor' }}
            </button>
          </div>
        </form>


        <!-- Vendor List -->
        <div class="d-flex justify-content-between align-items-center mt-5">
          <h6 class="mb-0">Vendor List</h6>
          <input type="text"
                 [(ngModel)]="searchText"
                 class="form-control search-box"
                 placeholder="Search vendor..." />
        </div>

        <!-- Vendor Table -->
        <div class="table-container mt-3">
          <div class="table-rounded">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-header">
                <tr>
                  <th>#</th>
                  <th>Vendor Code</th>
                  <th>Vendor Name</th>
                  <th>Arabic Name</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Address</th>
                  <th>VAT No</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let v of filteredVendors; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ v.vendor }}</td>
                  <td>{{ v.name }}</td>
                  <td>{{ v.namear }}</td>
                  <td>{{ v.email }}</td>
                  <td>{{ v.phone }}</td>
                  <td>{{ v.address }}</td>
                  <td>{{ v.vatno }}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-primary me-1" (click)="onEdit(v)">Edit</button>
                    <button class="btn btn-sm btn-outline-danger" (click)="onDelete(v.vendor)">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
