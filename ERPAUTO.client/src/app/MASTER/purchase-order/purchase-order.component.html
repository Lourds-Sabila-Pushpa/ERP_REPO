<div class="container">
  <div class="main-card">
    <!-- 🔷 Navbar -->
    <div class="inner-navbar d-flex justify-content-between align-items-center">
      <h5>Purchase Order</h5>
    </div>

    <!-- 🌤️ HEADER SECTION (compact + inline fields) -->
    <div class="form-section header-highlight">
      <div class="row align-items-center mb-2">
        <div class="col-md-4 d-flex align-items-center">
          <label class="form-label me-2 mb-0">Vendor:</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="header.vendor"
                 placeholder="Vendor code or name" />
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <label class="form-label me-2 mb-0">PO Type:</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="header.doctype"
                 placeholder="Type" />
        </div>
        <div class="col-md-4 d-flex align-items-center">
          <label class="form-label me-2 mb-0">PO Date:</label>
          <input type="date"
                 class="form-control short-date"
                 [(ngModel)]="header.docdt" />
        </div>
      </div>
    </div>

    <!-- 🧩 DETAIL ENTRY SECTION -->
    <div class="form-section">
      <div class="row g-3 align-items-end mb-3">
        <div class="col-md-2">
          <label class="form-label">Part</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="detail.part"
                 placeholder="Part No" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Make</label>
          <input type="text"
                 class="form-control"
                 [(ngModel)]="detail.make"
                 placeholder="Make" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Qty</label>
          <input type="number"
                 class="form-control"
                 [(ngModel)]="detail.qty"
                 (input)="updateValue()" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Price</label>
          <input type="number"
                 class="form-control"
                 [(ngModel)]="detail.price"
                 (input)="updateValue()" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Discount</label>
          <input type="number"
                 class="form-control"
                 [(ngModel)]="detail.discount"
                 (input)="updateValue()" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Value</label>
          <input type="number"
                 class="form-control"
                 [(ngModel)]="detail.value"
                 readonly />
        </div>
        <div class="col-md-2">
          <label class="form-label">Vat%</label>
          <input type="number"
                 class="form-control"
                 [(ngModel)]="detail.vat"
                 placeholder="vat" />
        </div>
        <div class="col-md-2 text-end">
          <button class="btn btn-primary" (click)="addDetail()">+ Add</button>
        </div>
      </div>

      <!-- 📋 GRID -->
      <div class="table-container mt-3">
        <div class="table-rounded">
          <div class="table-scroll">
            <table class="table table-striped table-hover mb-0">
              <thead class="table-header">
                <tr>
                  <th>#</th>
                  <th>Part</th>
                  <th>Make</th>
                  <th>Qty</th>
                  <th>Price</th>
                  <th>Value</th>
                  <th class="text-center">Action</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let item of details; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td>{{ item.part }}</td>
                  <td>{{ item.make }}</td>
                  <td>{{ item.qty }}</td>
                  <td>{{ item.price }}</td>
                  <td>{{ item.value }}</td>
                  <td class="text-center">
                    <button class="btn btn-sm btn-outline-danger"
                            (click)="removeDetail(i)">
                      Delete
                    </button>
                  </td>
                </tr>
                <tr *ngIf="details.length === 0">
                  <td colspan="7" class="text-center text-muted">
                    No items added yet.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>


      <!-- 💾 SAVE -->
      <div class="text-end mt-4">
        <button class="btn btn-primary px-4" (click)="savePurchaseOrder()">
          Save Purchase Order
        </button>
      </div>
    </div>
  </div>
</div>
